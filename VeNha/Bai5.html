<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Khoa CNTTKD</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #ffffff;
        }

        /* Gợi ý i: Căn giữa toàn bộ nội dung khối */
        .best-shared {
            text-align: center;
        }

        .best-shared .logo {
            margin-bottom: 20px;
        }

        .best-shared .logo img {
            width: 200px;
        }

        /* Tiêu đề chính */
        .best-shared h2 {
            font-size: 38px;
            font-weight: normal;
            color: #333333;
            margin: 15px 0 12px 0;
        }

        /* Điểm nhấn chữ màu xanh cho thẻ <strong> */
        .best-shared h2 strong {
            color: #00aeef;
            font-weight: bold;
        }

        /* Đoạn văn bản mô tả in nghiêng */
        .best-shared .lead-text {
            font-style: italic;
            color: #555555;
            font-size: 15px;
            margin: 0 0 35px 0;
        }

        /* Danh sách nút bấm */
        .btn-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        /* Gợi ý iii: Chuyển các mục li thành dạng inline-block để nằm trên cùng 1 hàng ngang */
        .btn-list li {
            display: inline-block;
            margin: 0 8px;
        }

        /* Định dạng các nút bấm */
        .btn-list li a {
            display: inline-block;
            text-decoration: none; /* Gợi ý ii: Bỏ gạch chân mặc định của thẻ liên kết */
            background-color: #2d3032;
            color: #ffffff;
            font-size: 14px;
            padding: 12px 28px;
            border-radius: 6px;
            min-width: 120px;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        .btn-list li a:hover {
            background-color: #1a1c1d;
        }
    </style>
</head>
<body>
    <section class="best-shared">
        <p class="logo">
            <img style="width:200px" src="BIT-logo.png" alt="Logo Khoa CNTTKD">
        </p>

        <h2>Best <strong>Shared Hosting</strong> Company</h2>

        <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>

        <ul class="btn-list">
            <li><a href="./">View Plans</a></li>
            <li><a href="./">All Features</a></li>
        </ul>
    </section>
</body>
</html>
