<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 7 - Bố cục Layout Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
        }

        body {
            padding: 1%;
        }

        /* Nhãn chữ wrapper */
        .wrapper-label {
            font-size: 1.1rem;
            color: #000000;
            margin-bottom: 0.4%;
        }

        /* Khung bao ngoài wrapper co giãn 100% toàn trang */
        .wrapper {
            width: 100%;
            height: 96%;
            border: 2px solid #000000;
            padding: 0.8%;
            background-color: #ffffff;
        }

        /* Khối Header (đầu trang) */
        .wrapper header,
        .wrapper .header {
            width: 100%;
            height: 12%;
            border: 2px solid #000000;
            padding: 0.6% 1%;
            margin-bottom: 0.8%;
            font-size: 1rem;
            color: #000000;
        }

        /* Khối Nav (cột trái) */
        .wrapper nav,
        .wrapper .nav {
            float: left;
            width: 20%;
            height: 73.6%;
            border: 2px solid #000000;
            padding: 0.6% 1%;
            margin-bottom: 0.8%;
            font-size: 1rem;
            color: #000000;
        }

        /* Khối Main (nội dung chính bên phải) */
        .wrapper main,
        .wrapper .main {
            float: right;
            width: 79.2%;
            height: 73.6%;
            border: 2px solid #000000;
            padding: 0.6% 1%;
            margin-bottom: 0.8%;
            font-size: 1rem;
            color: #000000;
        }

        /* Khối Footer (chân trang dưới cùng) */
        .wrapper footer,
        .wrapper .footer {
            clear: both; /* Hủy float để xuống dưới cùng */
            width: 100%;
            height: 12%;
            border: 2px solid #000000;
            padding: 0.6% 1%;
            font-size: 1rem;
            color: #000000;
        }
    </style>
</head>
<body>
    <p class="wrapper-label">wrapper</p>
    <div class="wrapper">
        <header class="header">header</header>
        <nav class="nav">nav</nav>
        <main class="main">main</main>
        <footer class="footer">footer</footer>
    </div>
</body>
</html>
